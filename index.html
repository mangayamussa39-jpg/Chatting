<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="theme-color-meta" content="#f2f2fe">
<title>Responsive Navbar</title> 
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Roboto:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<!-- Added &display=block to the font URL to ensure stable font loading -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block" rel="stylesheet" />

<style>
:root {
    --primary: #fff;
    --text: #444;
    --secondary: #ececfe;
    --browser-bg: #fff;
    --active-color: #0b57d0; 
    --active-pill: #a6d4ef;
}

html.dark-mode {
    --primary: #111111;
    --text: #ccc;
    --secondary: #1f1f1f;
    --browser-bg: #111111;
    --active-color: #66a7d8; 
    --active-pill: #004a77;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;    
    -webkit-user-select: none;
    font-family: 'poppins';    
}

body {
    background-color: var(--browser-bg);
    font-family: sans-serif;    
    width: 100%;
    overflow: hidden; 
    color: var(--text);
}

.page-wrapper {
    display: flex;
    flex-direction: column; 
    height: 100dvh;
    width: 100%;
    background-color: var(--primary);
}

.main {
    flex: 1; 
    overflow: hidden; 
    display: flex;
    flex-direction: column;
    position: relative;
    align-items: center;
}

.header-bar{
    position: sticky;
    top: 0;
    width: 100%;
    padding: 5px 15px;
    display: flex;
    align-items: center;
    z-index: 999;
}

.header-left,
.header-center,
.header-right{
    flex: auto;
    display: flex;
    align-items: center;
    width: 12%;
}
.header-logo{
    height: 0px;   
    width: auto;
    flex-shrink: 0;
}
.header-center{
    justify-content: center;
    width: 70%;
    display: flex;
    justify-content: flex-start;
}

.header-right{
    justify-content: flex-end;
    width: 18%;
    gap: 10px;
}

.action-btn {
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    border-radius: 50px;
    color: var(--text);
    float: right;
    background: var(--secondary);
}

.action-btn .material-symbols-rounded {
    font-variation-settings: 'FILL' 0;
    font-size: 24px;
}

.navbar {
    display: flex;
    justify-content: space-evenly;
    align-items: center;    
    padding-top: 10px;
    padding-bottom: 5px;
    background: var(--primary);
    order: 1;
    flex-shrink: 0; 
    z-index: 999;
    border-top: 1px var(--secondary) solid;
    border-right: none;
}

.nav {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    color: var(--text);
}

.nav .icon-container {
    padding-top: 3px;
    width: 50px; 
    height: 28px; 
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 24px;
    background-color: transparent;    
}

.nav.active .icon-container {
    background-color: var(--active-pill);
}

.nav .material-symbols-rounded {
    font-size: 24px; 
    font-variation-settings: 'FILL' 0; 
    transition: font-variation-settings 0.3s ease;
    font-weight: 500;
}

.nav.active {
    color: var(--active-color);    
}

.nav.active .material-symbols-rounded {
    font-variation-settings: 'FILL' 1; 
    animation: subtle-bounce 0.4s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
    font-weight: 700;
}

.nav-name{
    font-weight: 500;
    font-size: 14px;
}

@keyframes subtle-bounce {
    0% { transform: scale(1, 1); }
    30% { transform: scale(1.15, 0.95); } 
    60% { transform: scale(0.9, 1.1); }   
    80% { transform: scale(1.05, 0.95); } 
    100% { transform: scale(1, 1); }
}

.search-box{
  display:flex;
  align-items:center;
  background: var(--secondary);
  height:60px;
  width: 92%;
  border-radius:30px;
  padding:0 12px;
  margin-right: auto;
  margin: 0px 20px;
}

.search-icon{
  font-size: 24px;
  padding: 5px;
  color: var(--text);
  margin-right:10px;
  font-weight: 500;
  flex-shrink:0;
}

.search-box input{
  flex:1;
  min-height:100%;
  border:none;
  outline:none;
  background:transparent;
  color: var(--text);
  font-size:16px;
}

.search-box button{
  border:none;
  background:transparent;
  font-size:24px;
  cursor:pointer;
  margin-left:8px;
  display:none;
  color: var(--text);
  flex-shrink:0;
  padding: 5px;
  padding-right: 10px;
}
.page{
    width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;    
    align-items:center;
}
.hero{
    display: flex;
    flex-direction: column;
    width: 95%;
    height: 600px;
    justify-content:center;
    align-items:center;
}
.headline{
    width:80%;
    height:40%;
    order: 1;
}
.hero-image{
    width:100%;
    height:100%;
    background: no-repeat center url('hero.png');
    background-size: cover;
    border-radius: 30px;
}

@media (min-width: 600px) {
    html {
        background-color: var(--primary);
    }
    .headline{
        order: 0;
    }
    .page-wrapper {
        flex-direction: row; 
    }
    .hero{
        height: 340px;      
        flex-direction: row;
    }
    .header-center{
        justify-content: flex-start;
    }
    .header-left,
    .header-center,
    .header-right{    
        width: 7%;
    }
    .header-center{
        width: 73%;    
    }
    .header-right{    
        width: 18%;
    }
    .search-box{
        width: 50%;
        margin-right: auto;
    }
    .navbar {
        width: 100px;
        height: 100%;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        order: 0;
        border-top: none;
        border-right: 1px var(--secondary) solid;
    }
    .nav {
        flex: none;
    }
}
</style>
</head>
<body>

<div class="page-wrapper">

    <!-- THE NAVBAR -->
    <nav class="navbar">
        <div class="nav active">
            <!-- Used code point &#xe88a; instead of 'home' -->
            <div class="icon-container"><span class="material-symbols-rounded">&#xe88a;</span></div>
            <span class="nav-name">Home</span>
        </div>
        <div class="nav">
            <!-- Used code point &#xe871; instead of 'dashboard' -->
            <div class="icon-container"><span class="material-symbols-rounded">&#xe871;</span></div>
            <span class="nav-name">Category</span>
        </div>
        <div class="nav">
            <!-- Used code point &#xe8d1; instead of 'store' -->
            <div class="icon-container"><span class="material-symbols-rounded">&#xe8d1;</span></div>
            <span class="nav-name">Shop</span>
        </div>
        <div class="nav">
            <!-- Used code point &#xe8cc; instead of 'shopping_cart' -->
            <div class="icon-container"><span class="material-symbols-rounded">&#xe8cc;</span></div>
            <span class="nav-name">Cart</span>
        </div>
        <div class="nav">
            <!-- Used code point &#xe5d3; instead of 'more_horiz' -->
            <div class="icon-container"><span class="material-symbols-rounded">&#xe5d3;</span></div>
            <span class="nav-name">More</span>
        </div>
    </nav>
    
    <!-- THE MAIN -->
    <div class="main">        
        <header class="header-bar">
        <div class="header-left">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/060/687/101/small/impressive-victorian-abstract-logo-formed-by-two-intersecting-lines-crisp-edges-minimal-flat-color-with-scalable-design-4k-png.png" alt="Logo" class="header-logo">
        </div>        
        <div class="header-center">
            <h2>Mussa Furnitures</h2>
        </div>
        <div class="header-right">
            <div id="theme-switch" class="action-btn">
                <!-- Used code point &#xe518; instead of 'light_mode' -->
                <span class="material-symbols-rounded" id="theme-icon">&#xe518;</span>
            </div>
            <div id="language-translation" class="action-btn">Swahili
                <!-- Used code point &#xe927; instead of 'g_translate' -->
                <span class="material-symbols-rounded">&#xe927;</span>
            </div>
        </div>
        </header>
        
        <div class="search-box">
            <!-- Used code point &#xe8b6; instead of 'search' -->
            <span class="material-symbols-rounded search-icon">&#xe8b6;</span>                    
            <input id="search" type="text" placeholder="Search for Furniture" />
            <button class="clear" id="clearBtn">×</button>              
        </div>
    
        <div class="page">
            <section class="hero">
                <div class="headline">
                    <h1>Welcome my friend</h1>
                    <p>Anything stupid</p>
                </div>
                <div class="hero-image"></div>
            </section>
        </div> 
    </div>
</div>
    
<script src="screen.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const htmlElement = document.documentElement;
    const themeIcon = document.getElementById('theme-icon');

    // Theme Toggle
    document.getElementById('theme-switch').addEventListener('click', () => {
        htmlElement.classList.toggle('dark-mode');
        const isDark = htmlElement.classList.contains('dark-mode');
        // Updated to use innerHTML so the HTML entity codes are rendered as icons, not raw text
        themeIcon.innerHTML = isDark ? '&#xe51c;' : '&#xe518;';
    });

    // Nav Active Toggle with Animation Reset
    const navItems = document.querySelectorAll('.nav');
    navItems.forEach(nav => {
        nav.addEventListener('click', () => {
            document.querySelector('.nav.active').classList.remove('active');
            nav.classList.remove('active');
            void nav.offsetWidth; 
            nav.classList.add('active');
        });
    });
});
</script>
<script>
const input = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");

input.addEventListener("input", () => {
  clearBtn.style.display = input.value.length ? "block" : "none";
});

clearBtn.addEventListener("click", () => {
  input.value = "";
  clearBtn.style.display = "none";
  input.focus();
});
</script>
</body>
</html>
